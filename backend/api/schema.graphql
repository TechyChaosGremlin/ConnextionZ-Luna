  username: String!
  password: String!
}

input LoginInput {
  email: String!
  password: String!
}

input RefreshTokenInput {
  refreshToken: String!
}

input UpdateProfileInput {
  displayName: String
  bio: String
  avatarUrl: String
  coverImageUrl: String
  websiteUrl: String
  location: String
  socialLinks: JSON
  tags: [String!]
}

input CreatePostInput {
  contentType: ContentType!
  title: String
  body: String
  caption: String
  tags: [String!]
  soundTrack: String
  scheduledAt: DateTime
  mediaUrls: [String!]
}

input UpdatePostInput {
  title: String
  body: String
  caption: String
  tags: [String!]
  status: ContentStatus
}

input CreateCommentInput {
  postId: UUID!
  parentId: UUID
  body: String!
  mentions: [UUID!]!
}

input CreateCollaborationInput {
  title: String!
  description: String
  contentType: String
  platform: String
  tags: [String!]
  participantIds: [UUID!]!
  budgetMin: Float
  budgetMax: Float
  budgetCurrency: String
}

input UpdateCollaborationInput {
  title: String
  description: String
  status: CollaborationStatus
  budgetMin: Float
  budgetMax: Float
}

input AddMilestoneInput {
  collaborationId: UUID!
  title: String!
  description: String
  dueAt: DateTime
