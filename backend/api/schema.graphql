  totalShares: Int!
  totalSaves: Int!
  uniqueViewers: Int!
  totalUploads: Int!
  totalPublishedVideos: Int!
  avgWatchTime: Float
  completionRate: Float

  # Audience
  followerGrowth: Int!
  newFollowers: Int!
  lostFollowers: Int!

  # Earnings / Collaboration
  activeCollaborations: Int!
  completedCollaborations: Int!
  totalCollaborationRequests: Int!
  pendingCollaborations: Int!
  acceptedCollaborations: Int!
  declinedCollaborations: Int!
  cancelledCollaborations: Int!
  collaborationAcceptanceRate: Float
  collaborationCompletionRate: Float
  averageResponseHours: Float
  collaborationSuccessRate: Float
  totalEarnings: Float
  earningsCurrency: String!

