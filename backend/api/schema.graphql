}

type PostCommentsConnection {
  edges: [CommentEdge!]!
  pageInfo: PageInfo!
  totalCount: Int!
}

type CommentEdge {
  cursor: String!
  node: Comment!
}

type CollaborationConnection {
  edges: [CollaborationEdge!]!
  pageInfo: PageInfo!
  totalCount: Int!
}

type CollaborationEdge {
  cursor: String!
  node: Collaboration!
}

type MessageConnection {
  edges: [MessageEdge!]!
  pageInfo: PageInfo!
  totalCount: Int!
}

type MessageEdge {
  cursor: String!
  node: Message!
}

type NotificationConnection {
  edges: [NotificationEdge!]!
  pageInfo: PageInfo!
  totalCount: Int!
}

type NotificationEdge {
  cursor: String!
  node: Notification!
}

type ConversationConnection {
  edges: [ConversationEdge!]!
  pageInfo: PageInfo!
  totalCount: Int!
}

type ConversationEdge {
  cursor: String!
  node: Conversation!
}

type CreatorCardConnection {
  edges: [CreatorCardEdge!]!
