# ============================================================================
# ConnextionZ Platform — GraphQL Schema (SDL)
# ============================================================================
# Canonical API contract. All 14 SRS features represented.
# Served at: POST /api/graphql  |  GraphiQL: GET /api/graphql
# ============================================================================

# ── Custom Scalars ──────────────────────────────────────────────────────────

scalar UUID
scalar DateTime
scalar JSON

# ── Enums ───────────────────────────────────────────────────────────────────

enum UserRole {
  ADMIN
  CREATOR
  USER
  GUEST
}

enum AccountStatus {
  ACTIVE
  SUSPENDED
  BANNED
  PENDING_VERIFICATION
}

enum ContentType {
  POST
  VIDEO
  IMAGE
  AUDIO
  LIVE_STREAM
}

enum ContentStatus {
  DRAFT
  PUBLISHED
  ARCHIVED
  FLAGGED
  REMOVED
}

enum CollaborationStatus {
  PROPOSED
  ACCEPTED
  DECLINED
  IN_PROGRESS
  COMPLETED
  CANCELLED
}

enum MilestoneStatus {
  PENDING
  IN_PROGRESS
  COMPLETED
  DISPUTED
}

enum NotificationType {
  COLLABORATION_INVITE
  COLLABORATION_ACCEPTED
  COLLABORATION_COMPLETED
  NEW_FOLLOWER
  NEW_COMMENT
  NEW_LIKE
  MENTION
  MESSAGE
  BADGE_EARNED
  ENDORSEMENT_RECEIVED
  MILESTONE_COMPLETED
  SYSTEM
}

enum NotificationChannel {
  IN_APP
  PUSH
  EMAIL
}

enum ReportTargetType {
  POST
  COMMENT
  USER
  MESSAGE
}

enum ReportStatus {
  PENDING
  REVIEWING
  RESOLVED
  DISMISSED
}

enum SortDirection {
  ASC
  DESC
}

enum FeedAlgorithm {
  PERSONALIZED
  TRENDING
  RECENT
  FOLLOWING
}

# ── Pagination (Relay Connection Spec) ───────────────────────────────────────

type PageInfo {
  hasNextPage: Boolean!
  hasPreviousPage: Boolean!
  startCursor: String
  endCursor: String
}

# ── Core Types ──────────────────────────────────────────────────────────────

# ---- User & Profile (Features: Auth, Profiles) ----

type User {
  id: UUID!
  email: String!
  username: String!
  role: UserRole!
  status: AccountStatus!
  emailVerified: Boolean!
  mfaEnabled: Boolean!
  lastLoginAt: DateTime
  createdAt: DateTime!
  updatedAt: DateTime!

  # Nested
  profile: Profile
}

type Profile {
  id: UUID!
  userId: UUID!
  displayName: String!
  bio: String
  avatarUrl: String
  coverImageUrl: String
  websiteUrl: String
  location: String
  socialLinks: JSON
  tags: [String!]

  # Metrics (denormalized)
  followerCount: Int!
  followingCount: Int!
  collaborationCount: Int!
  totalLikes: Int!

  createdAt: DateTime!
  updatedAt: DateTime!

  # Nested
  user: User
}

# ---- Content (Features: Feed, Trending Sounds, Live Streaming) ----

type Post {
  id: UUID!
  userId: UUID!
  contentType: ContentType!
  status: ContentStatus!
  title: String
  body: String
  caption: String
  tags: [String!]
  mentions: [UUID!]
  soundTrack: String

  # Metrics
  likeCount: Int!
  commentCount: Int!
  shareCount: Int!
  viewCount: Int!

  # Scheduling
  scheduledAt: DateTime
  publishedAt: DateTime

  createdAt: DateTime!
  updatedAt: DateTime!

  # Nested
  author: User
  profile: Profile
  media: [Media!]
  comments: PostCommentsConnection
}

type Media {
  id: UUID!
  postId: UUID!
  userId: UUID!
  mediaType: String!
  url: String!
  thumbnailUrl: String
  fileSizeBytes: Int
  width: Int
  height: Int
  durationSeconds: Float
  isProcessed: Boolean!

  createdAt: DateTime!
  updatedAt: DateTime!
}

type Comment {
  id: UUID!
  postId: UUID!
  userId: UUID!
  parentId: UUID
  body: String!
  isEdited: Boolean!
  likeCount: Int!

  createdAt: DateTime!
  updatedAt: DateTime!

  author: User
  replies: [Comment!]
}

# ---- Collaboration (Feature: Collaboration Button & Marketplace) ----

type Collaboration {
  id: UUID!
  initiatorId: UUID!
  title: String!
  description: String
  status: CollaborationStatus!
  contentType: String
  platform: String
  tags: [String!]

  # Budget
  budgetMin: Float
  budgetMax: Float
  budgetCurrency: String!

  # Timeline
  proposedAt: DateTime
  startedAt: DateTime
  completedAt: DateTime

  createdAt: DateTime!
  updatedAt: DateTime!

  initiator: User
  participants: [CollaborationParticipant!]
  milestones: [Milestone!]
}

type CollaborationParticipant {
  id: UUID!
  collaborationId: UUID!
  userId: UUID!
  role: String!
  accepted: Boolean!
  acceptedAt: DateTime

  user: User
}

type Milestone {
  id: UUID!
  collaborationId: UUID!
  title: String!
  description: String
  status: MilestoneStatus!
  sortOrder: Int!
  dueAt: DateTime
  completedAt: DateTime

  createdAt: DateTime!
  updatedAt: DateTime!
}

# ---- Messaging (Feature: Direct Messaging) ----

type Conversation {
  id: UUID!
  title: String
  isGroup: Boolean!

  # Preview
  lastMessageText: String
  lastMessageAt: DateTime
  lastMessageBy: UUID

  createdAt: DateTime!
  updatedAt: DateTime!

  participants: [ConversationParticipant!]
  messages: MessageConnection
}

type ConversationParticipant {
  id: UUID!
  conversationId: UUID!
  userId: UUID!
  isAdmin: Boolean!
  lastReadAt: DateTime
  isMuted: Boolean!

  user: User
}

type Message {
  id: UUID!
  conversationId: UUID!
  senderId: UUID!
  body: String!
  contentType: String!
  attachments: JSON
  isEdited: Boolean!
  editedAt: DateTime

  createdAt: DateTime!
  updatedAt: DateTime!

  sender: User
}

# ---- Notifications (Feature: Real-time Notifications) ----

type Notification {
  id: UUID!
  userId: UUID!
  type: NotificationType!
  title: String!
  body: String
  data: JSON
  channel: NotificationChannel!
  isRead: Boolean!
  readAt: DateTime
  actorId: UUID

  createdAt: DateTime!

  actor: User
}

# ---- Reputation (Feature: Reputation System) ----

type ReputationScore {
  id: UUID!
  userId: UUID!
  overallScore: Float!
  collaborationScore: Float!
  contentQualityScore: Float!
  communityScore: Float!
  reliabilityScore: Float!
  totalEndorsements: Int!
  completedCollaborations: Int!
  onTimeDeliveryRate: Float!
  computedAt: DateTime

  createdAt: DateTime!
  updatedAt: DateTime!
}

type Endorsement {
  id: UUID!
  endorserId: UUID!
  endorseeId: UUID!
  category: String!
  comment: String
  rating: Int!
  collaborationId: UUID

  createdAt: DateTime!

  endorser: User
  endorsee: User
}

type Badge {
  id: UUID!
  name: String!
  description: String
  iconUrl: String
  category: String!
  tier: Int!

  createdAt: DateTime!
}

type UserBadge {
  id: UUID!
  userId: UUID!
  badgeId: UUID!

  awardedAt: DateTime
  awardedBy: UUID

  badge: Badge
}

# ---- Live Streaming (Feature: Live Streaming) ----

type LiveStream {
  id: UUID!
  userId: UUID!
  title: String!
  status: ContentStatus!
  streamUrl: String
  thumbnailUrl: String
  viewerCount: Int!
  startedAt: DateTime
  endedAt: DateTime

  createdAt: DateTime!
  updatedAt: DateTime!

  streamer: User
}

# ---- Trending Sounds (Feature: Trending Sounds) ----

type Sound {
  id: UUID!
  name: String!
  artist: String
  sourceUrl: String
  coverUrl: String
  usageCount: Int!
  trendingScore: Float!
}

# ---- Creator Discovery (Feature: Creator Discovery) ----

type CreatorCard {
  user: User!
  profile: Profile!
  relevanceScore: Float!
  matchingTags: [String!]
  reputationScore: Float
}

# ---- Brand Partnerships (Feature: Brand Partnerships) ----

type BrandOpportunity {
  id: UUID!
  brandId: UUID!
  title: String!
  description: String
  requirements: JSON
  budgetMin: Float
  budgetMax: Float
  budgetCurrency: String!
  deadline: DateTime
  status: CollaborationStatus!

  createdAt: DateTime!
  updatedAt: DateTime!

  brand: User
  applications: [BrandApplication!]
}

type BrandApplication {
  id: UUID!
  opportunityId: UUID!
  creatorId: UUID!
  message: String
  status: CollaborationStatus!

  createdAt: DateTime!
  updatedAt: DateTime!

  creator: User
}

# ---- Search (Feature: Platform-wide Search) ----

type SearchResult {
  type: String!        # "user", "post", "sound", "collaboration", "brand_opportunity"
  score: Float!
  user: User
  post: Post
  sound: Sound
  collaboration: Collaboration
}

# ---- Trust & Safety (Feature: Trust & Safety Reporting) ----

type Report {
  id: UUID!
  reporterId: UUID!
  targetType: ReportTargetType!
  targetId: UUID!
  reason: String!
  description: String
  status: ReportStatus!

  createdAt: DateTime!
  updatedAt: DateTime!
}

# ---- Analytics (Feature: Analytics Dashboard) ----

