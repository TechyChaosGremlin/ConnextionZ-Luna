  monthlyActiveUsers: Int
  totalUploads: Int!
  totalPublishedVideos: Int!
  totalViews: Int!
  uniqueViewers: Int!
  totalLikes: Int!
  totalComments: Int!
  totalShares: Int!
  totalSaves: Int!
