}

type SearchResultConnection {
  edges: [SearchResultEdge!]!
  pageInfo: PageInfo!
  totalCount: Int!
}

type SearchResultEdge {
  cursor: String!
  node: SearchResult!
}

type LiveStreamConnection {
  edges: [LiveStreamEdge!]!
  pageInfo: PageInfo!
  totalCount: Int!
}

type LiveStreamEdge {
  cursor: String!
  node: LiveStream!
}

type BrandOpportunityConnection {
  edges: [BrandOpportunityEdge!]!
  pageInfo: PageInfo!
  totalCount: Int!
}

type BrandOpportunityEdge {
  cursor: String!
  node: BrandOpportunity!
}

type EndorsementConnection {
  edges: [EndorsementEdge!]!
  pageInfo: PageInfo!
  totalCount: Int!
}

type EndorsementEdge {
  cursor: String!
  node: Endorsement!
}

type ReportConnection {
  edges: [ReportEdge!]!
  pageInfo: PageInfo!
  totalCount: Int!
}

