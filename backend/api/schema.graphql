# ── Root Query ───────────────────────────────────────────────────────────────

type Query {
  # ---- Health ----
  health: String!

  # ---- Auth (Feature 14) ----
  """
  Get the currently authenticated user. Requires valid JWT.
  """
  me: User!

  # ---- Profiles (Feature 4) ----
  """
  Get a user's public profile by user ID or username.
  """
  profile(userId: UUID, username: String): Profile
  profiles(
    userIds: [UUID!]
    first: Int = 20
    after: String
  ): CreatorCardConnection

  # ---- Feed (Feature 5) ----
  """
  Personalized feed for the authenticated user.
  Uses Two-Tower model for ranking when algorithm is PERSONALIZED.
  """
  feed(
    filter: FeedFilter
    first: Int = 20
    after: String
  ): PostConnection!

  """
  Get a specific post by ID.
  """
  post(id: UUID!): Post

  """
  Get posts by a specific user.
  """
  userPosts(
    userId: UUID!
    first: Int = 20
    after: String
  ): PostConnection!

  # ---- Collaboration (Feature 1) ----
  """
  List collaborations for the authenticated user (as initiator or participant).
  """
  myCollaborations(
    status: CollaborationStatus
    first: Int = 20
    after: String
  ): CollaborationConnection!

  """
  Browse the collaboration marketplace.
  """
  collaborationMarketplace(
    tags: [String!]
    contentType: String
    first: Int = 20
    after: String
  ): CollaborationConnection!

  """
  Get a single collaboration by ID.
  """
  collaboration(id: UUID!): Collaboration

  # ---- Messaging (Feature 6) ----
  """
  List conversations for the authenticated user.
  """
  conversations(
    first: Int = 20
    after: String
  ): ConversationConnection!

  """
  Get messages for a conversation.
  """
  messages(
    conversationId: UUID!
    first: Int = 50
    after: String
  ): MessageConnection!

  """
  A conversation the authenticated user participates in.
  """
  conversation(id: UUID!): Conversation!

  # ---- Notifications (Feature 11) ----
  """
  Notifications for the authenticated user.
  """
  notifications(
    unreadOnly: Boolean = false
    first: Int = 20
    after: String
  ): NotificationConnection!

  """
  Count of unread notifications.
  """
  unreadNotificationCount: Int!

  """
  Count unread messages across the authenticated user's conversations.
  """
  unreadConversationCount: Int!

  # ---- Reputation (Feature 3) ----
  """
  Get a user's reputation score.
  """
  reputation(userId: UUID!): ReputationScore

  """
  Get endorsements for a user.
  """
  endorsements(
    userId: UUID!
    category: String
    first: Int = 20
    after: String
  ): EndorsementConnection!

  """
  Get a user's earned badges.
  """
  userBadges(userId: UUID!): [UserBadge!]!

  """
  List all available badge definitions.
  """
  badges: [Badge!]!

  # ---- Live Streaming (Feature 7) ----
  """
  Currently active live streams.
  """
  liveStreams(
    first: Int = 20
    after: String
  ): LiveStreamConnection!

  """
  Get a specific live stream.
  """
  liveStream(id: UUID!): LiveStream

  # ---- Creator Discovery (Feature 9) ----
  """
  Discover creators matching tags, interests, or free-text query.
  Uses ANN search via pgvector for tag-based discovery.
  Uses Agentic Router (LLM) for complex natural-language queries.
  """
  discoverCreators(
    query: String
    tags: [String!]
    first: Int = 20
    after: String
  ): CreatorCardConnection!

  # ---- Search (Feature 12) ----
  """
  Platform-wide search across users, posts, sounds, and collaborations.
  """
  search(
    input: SearchInput!
    first: Int = 20
    after: String
  ): SearchResultConnection!

  # ---- Analytics (Feature 13) ----
  """
  Get analytics summary for the authenticated creator.
  """
  creatorAnalytics(
    period: AnalyticsPeriod!
  ): AnalyticsSummary!

  creatorVideoAnalytics(
    period: AnalyticsPeriod!
    sortBy: String = "recent"
  ): [PostAnalytics!]!

  creatorAnalyticsTrends(
    period: AnalyticsPeriod!
  ): [AnalyticsTrendPoint!]!

  platformAnalytics(
    period: AnalyticsPeriod!
  ): PlatformAnalytics!

  platformAnalyticsTrends(
    period: AnalyticsPeriod!
  ): [PlatformAnalyticsTrend!]!

  platformTopContent(
    period: AnalyticsPeriod!
    sortBy: String = "views"
  ): [PlatformContentAnalytics!]!

  """
  Get analytics for a specific post.
  """
  postAnalytics(
    postId: UUID!
  ): PostAnalytics

  # ---- Trust & Safety (Feature 14) ----
  """
  Get reports submitted by the authenticated user.
  """
  myReports(
    first: Int = 20
    after: String
  ): ReportConnection!
}

# ── Root Mutation ────────────────────────────────────────────────────────────

type Mutation {
  # ---- Auth ----
  """
  Register a new user. Returns JWT tokens.
  """
  register(input: RegisterInput!): AuthPayload!

  """
  Login with email and password. Returns JWT tokens.
  """
  login(input: LoginInput!): AuthPayload!

  """
  Refresh an expired access token using a valid refresh token.
  """
  refreshToken(input: RefreshTokenInput!): AuthPayload!

  """
  Logout — blacklists the current token.
  """
  logout: Boolean!

  # ---- Profiles ----
  """
  Update the authenticated user's profile.
  """
  updateProfile(input: UpdateProfileInput!): Profile!

  # ---- Content ----
  """
  Create a new post.
  """
  createPost(input: CreatePostInput!): Post!

  """
  Update an existing post.
  """
  updatePost(id: UUID!, input: UpdatePostInput!): Post!

  """
  Delete a post (soft delete).
  """
  deletePost(id: UUID!): Boolean!

  """
  Soft-delete a message sent by the authenticated user.
  """
  deleteMessage(id: UUID!): Boolean!

  """
  Like or unlike a post. Returns the new like count.
