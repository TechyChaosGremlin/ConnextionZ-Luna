  engagementRate: Float!
  viewsGrowthPct: Float
  likesGrowthPct: Float
  commentsGrowthPct: Float
  sharesGrowthPct: Float
  followersGrowthPct: Float

  # Per-post analytics
  topPosts: [PostAnalytics!]
}

